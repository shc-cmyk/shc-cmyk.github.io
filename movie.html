<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FILM ARCHIVE</title>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel CDN (TSX 해석용) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- 한자 -> 한글 변환 라이브러리 CDN -->
  
  <style>
    :root {
      --bg-color: #ffffff;             
      --card-bg: #f8fafc;             
      --border-color: #e2e8f0;         
      --text-main: #334155;            
      --text-sub: #64748b;             
      --accent-pastel: #e0f2fe;        
      --accent-hover: #bae6fd;         
      --accent-text: #0369a1;          

      --tag-format-bg: #bae6fd;
      --tag-format-text: #0284c7;
      --tag-format-border: #7dd3fc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      margin: 0;
      padding: 12px 10px;
      color: var(--text-main);
      display: flex;
      justify-content: center;
    }

    .container {
      width: 680px;                   
      height: 435px;                  
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 16px 20px 18px 20px;
      box-shadow: 0 4px 16px rgba(148, 163, 184, 0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;               
    }

    .sticky-header {
      flex-shrink: 0;
      background: #ffffff;
      padding-bottom: 8px;
      margin-bottom: 8px;
    }

    .header {
      text-align: center;
      margin-bottom: 12px;
    }

    .header h1 {
      font-size: 1.35rem;
      letter-spacing: -0.02em;
      margin: 0;
      font-weight: 700;
      color: var(--text-main);
    }

    .search-form {
      display: flex;
      gap: 8px;
    }

    .input-field {
      flex: 1;
      padding: 8px 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 13.5px;
      outline: none;
      background-color: #f1f5f9;
      color: var(--text-main);
      transition: all 0.2s ease;
    }

    .input-field:focus {
      border-color: #93c5fd;
      background-color: #ffffff;
    }

    .btn {
      padding: 8px 16px;
      background-color: var(--accent-pastel);
      color: var(--accent-text);
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: 13.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      min-width: 44px;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    .btn:disabled {
      background-color: #f1f5f9;
      border-color: #e2e8f0;
      color: #94a3b8;
      cursor: not-allowed;
    }

    .scroll-content {
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
    }

    .scroll-content::-webkit-scrollbar {
      width: 6px;
    }
    .scroll-content::-webkit-scrollbar-track {
      background: transparent;
    }
    .scroll-content::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }
    .scroll-content::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* 첫 화면 명대사 안내 영역 스타일 */
    .empty-state {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-sub);
      text-align: center;
      padding-bottom: 15px;
    }

    .empty-state .quote {
      font-size: 13.5px;
      font-style: italic;
      font-weight: 500;
      line-height: 1.6;
      color: #64748b;
      margin: 0 0 6px 0;
    }

    .empty-state .author {
      font-size: 11.5px;
      color: #94a3b8;
      margin: 0;
    }

    .results-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .simple-card {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .simple-card:hover {
      border-color: #93c5fd;
      background: #f0f9ff;
      transform: translateY(-1px);
    }

    .simple-poster {
      width: 50px;
      height: 75px;
      object-fit: cover;
      border-radius: 6px;
      background-color: #e2e8f0;
      border: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .simple-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .simple-title-group {
      display: flex;
      align-items: baseline;
      gap: 6px;
      flex-wrap: wrap;
    }

    .simple-title-korean {
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .simple-title-original {
      font-size: 0.8rem;
      color: var(--text-sub);
    }

    .simple-actors {
      font-size: 12px;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .detail-view {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-back {
      align-self: flex-start;
      padding: 4px 10px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-sub);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-back:hover {
      background: var(--accent-pastel);
      color: var(--accent-text);
      border-color: #93c5fd;
    }

    .detail-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px 18px;
      display: flex;
      gap: 20px;
      border: 1px solid var(--border-color);
    }

    .poster-wrapper {
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      width: 110px;
    }

    .poster-img {
      width: 110px;
      height: 165px;
      object-fit: cover;
      border-radius: 8px;
      background-color: #e2e8f0;
      border: 1px solid var(--border-color);
    }

    .info-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
    }

    .title-group {
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 6px;
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .title-text-wrapper {
      display: flex;
      align-items: baseline;
      gap: 6px;
      flex-wrap: wrap;
    }

    .title-korean {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .title-original {
      font-size: 0.92rem;
      color: var(--text-sub);
    }

    .attr-table {
      display: grid;
      grid-template-columns: 80px 1fr;
      row-gap: 10px;
      font-size: 13px;
      align-items: center;
    }

    .attr-label {
      color: var(--text-sub);
      font-weight: 600;
    }

    .attr-value {
      color: var(--text-main);
      line-height: 1.35;
      word-break: break-word;
    }

    .tag {
      display: inline-block;
      background: #e2e8f0;
      color: #334155;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 11px;
      margin-right: 4px;
      margin-bottom: 2px;
    }

    .tag-format {
      background: var(--tag-format-bg);
      color: var(--tag-format-text);
      font-weight: 700;
      border: 1px solid var(--tag-format-border);
    }

    .loading-text {
      text-align: center;
      color: var(--text-sub);
      padding: 30px;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel" data-presets="typescript,react">
    const { useState } = React;

    const TMDB_API_KEY = "2b41b01f33bead2c5ec02d391886ae25";
    const TMDB_READ_TOKEN = "eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiIyYjQxYjAxZjMzYmVhZDJjNWVjMDJkMzkxODg2YWUyNSIsIm5iZiI6MTc4NTY3MTU5My42MzEsInN1YiI6IjZhNmYyZmE5M2RiMGIzM2NlZjk1MDdmYiIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.bLxLfumrSA-GVX5Czby354InzGJHKNesSHAdBtK5iH8";
    const TMDB_BASE_URL = "https://api.themoviedb.org/3";
    const TMDB_IMAGE_BASE_URL = "https://image.tmdb.org/t/p/w500";


    const App = () => {
      const [query, setQuery] = useState('');
      const [items, setItems] = useState([]);
      const [selectedItem, setSelectedItem] = useState(null);
      const [loading, setLoading] = useState(false);
      const [searched, setSearched] = useState(false);

      const handleSearch = async (e) => {
        e.preventDefault();
        if (!query.trim()) return;

        setLoading(true);
        setSearched(true);
        setSelectedItem(null);

        try {
          const searchRes = await fetch(
            `${TMDB_BASE_URL}/search/multi?api_key=${TMDB_API_KEY}&language=ko-KR&query=${encodeURIComponent(query)}&page=1`,
            { headers: { Authorization: `Bearer ${TMDB_READ_TOKEN}` } }
          );
          const searchData = await searchRes.json();
          const filtered = (searchData.results || []).filter(
            item => item.media_type === 'movie' || item.media_type === 'tv'
          );

          const detailedItems = await Promise.all(
            filtered.map(async (item) => {
              const isMovie = item.media_type === 'movie';
              const detailUrl = `${TMDB_BASE_URL}/${isMovie ? 'movie' : 'tv'}/${item.id}?language=ko-KR`;
              const creditUrl = `${TMDB_BASE_URL}/${isMovie ? 'movie' : 'tv'}/${item.id}/credits`;

              const [detailRes, creditRes] = await Promise.all([
                fetch(detailUrl, { headers: { Authorization: `Bearer ${TMDB_READ_TOKEN}` } }),
                fetch(creditUrl, { headers: { Authorization: `Bearer ${TMDB_READ_TOKEN}` } })
              ]);

              const detail = await detailRes.json();
              const credits = await creditRes.json();

              const title = isMovie ? detail.title : detail.name;
              const originalTitle = isMovie ? detail.original_title : detail.original_name;
              const format = isMovie ? 'Movie' : 'Series';
              
              const dateStr = isMovie ? detail.release_date : detail.first_air_date;
              const year = dateStr ? parseInt(dateStr.split('-')[0], 10) : 'No information';

              const nation = isMovie
                ? (detail.production_countries || []).map(c => c.name)
                : (detail.origin_country || []);

              const runningTime = isMovie
                ? (detail.runtime ? `${detail.runtime}분` : 'No information')
                : (detail.number_of_episodes ? `${detail.number_of_episodes}부작` : 'No information');

              const image = detail.poster_path ? `${TMDB_IMAGE_BASE_URL}${detail.poster_path}` : null;
              const genre = (detail.genres || []).map(g => g.name);

              // 배우 이름 추출
              const actors = (credits.cast || [])
  .slice(0, 3)
  .map(a => a.original_name || a.name);

// 감독 이름
let director = '';
if (isMovie) {
  const dirObj = (credits.crew || []).find(c => c.job === 'Director');
  director = dirObj ? (dirObj.original_name || dirObj.name) : 'No information';
} else {
  const creators = (detail.created_by || []).map(c => c.original_name || c.name);
  director = creators.length > 0 ? creators.join(', ') : 'No information';
}

              return {
                id: item.id,
                title,
                originalTitle,
                format,
                year: year !== 'No information' ? `${year}년` : year,
                nation,
                runningTime,
                image,
                actors,
                director,
                genre
              };
            })
          );

          setItems(detailedItems);
        } catch (err) {
          console.error("Data load failure:", err);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="container">
          {/* 상단 헤더 & 검색창 */}
          <div className="sticky-header">
            <div className="header">
              <h1>FILM ARCHIVE</h1>
            </div>

            <form onSubmit={handleSearch} className="search-form">
              <input
                type="text"
                className="input-field"
                placeholder="Search..."
                value={query}
                onChange={(e) => setQuery(e.target.value)}
              />
              <button type="submit" className="btn" disabled={loading}>
                {loading ? '⏳' : '🔍'}
              </button>
            </form>
          </div>

          {/* 스크롤 가능한 메인 콘텐츠 */}
          <div className="scroll-content">
            {/* 1. 검색 전 첫 화면: 명대사 표기 */}
            {!loading && !searched && (
              <div className="empty-state">
                <p className="quote">"Once I get going... then I like, forget everything... and I've got this fire in my body. I'm just there. Flyin' like a bird. Like electricity. Yeah, like electricity."</p>
                <p className="author">- Billy Elliot</p>
              </div>
            )}

            {loading && <div className="loading-text">Loading details...</div>}

            {!loading && searched && items.length === 0 && (
              <div className="loading-text">No search results found.</div>
            )}

            {/* 2. 작품 상세 정보 View */}
            {!loading && selectedItem ? (
              <div className="detail-view">
                <button className="btn-back" onClick={() => setSelectedItem(null)}>
                  ← Back
                </button>
                <div className="detail-card">
                  <div className="poster-wrapper">
                    {selectedItem.image ? (
                      <img src={selectedItem.image} alt={selectedItem.title} className="poster-img" />
                    ) : (
                      <div className="poster-img" style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--text-sub)', fontSize: '11px' }}>
                        🖼️ No image
                      </div>
                    )}
                  </div>

                  <div className="info-container">
                    <div className="title-group">
                      <div className="title-text-wrapper">
                        <span className="title-korean">{selectedItem.title}</span>
                        <span className="title-original">({selectedItem.originalTitle})</span>
                      </div>
                    </div>

                    <div className="attr-table">
                      <div className="attr-label">Format</div>
                      <div className="attr-value">
                        <span className="tag tag-format">{selectedItem.format}</span>
                      </div>

                      <div className="attr-label">Year</div>
                      <div className="attr-value">{selectedItem.year}</div>

                      <div className="attr-label">Run Time</div>
                      <div className="attr-value">{selectedItem.runningTime}</div>

                      <div className="attr-label">Director</div>
                      <div className="attr-value">{selectedItem.director}</div>

                      <div className="attr-label">Actors</div>
                      <div className="attr-value">
                        {selectedItem.actors.length > 0 ? selectedItem.actors.join(', ') : 'No information'}
                      </div>

                      <div className="attr-label">Nation</div>
                      <div className="attr-value">
                        {selectedItem.nation.length > 0 ? (
                          selectedItem.nation.map((n, idx) => <span key={idx} className="tag">{n}</span>)
                        ) : 'No information'}
                      </div>

                      <div className="attr-label">Genre</div>
                      <div className="attr-value">
                        {selectedItem.genre.length > 0 ? (
                          selectedItem.genre.map((g, idx) => <span key={idx} className="tag">{g}</span>)
                        ) : 'No information'}
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            ) : (
              /* 3. 검색 결과 목록 View */
              !loading && searched && (
                <div className="results-list">
                  {items.map((item) => (
                    <div 
                      key={item.id} 
                      className="simple-card" 
                      onClick={() => setSelectedItem(item)}
                    >
                      {item.image ? (
                        <img src={item.image} alt={item.title} className="simple-poster" />
                      ) : (
                        <div className="simple-poster" style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--text-sub)', fontSize: '10px' }}>
                          🖼️
                        </div>
                      )}

                      <div className="simple-info">
                        <div className="simple-title-group">
                          <span className="simple-title-korean">{item.title}</span>
                          <span className="simple-title-original">({item.originalTitle})</span>
                        </div>
                        <div className="simple-actors">
                          {item.actors.length > 0 ? item.actors.join(', ') : 'No cast information'}
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              )
            )}
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
