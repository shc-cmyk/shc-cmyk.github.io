<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>현장 설문조사</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --primary: #4a6fa5;
      --primary-hover: #3b5982;
      --text-main: #1e293b;
      --text-sub: #64748b;
      --border-color: #e2e8f0;
      --selected-bg: #eff6ff;
      --selected-border: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none; /* 부스 터치 시 텍스트 드래그 방지 */
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .kiosk-container {
      background: var(--card-bg);
      border-radius: 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.06);
      width: 100%;
      max-width: 520px;
      padding: 40px 32px;
      border: 1px solid var(--border-color);
      position: relative;
      overflow: hidden;
    }

    .survey-header {
      margin-bottom: 32px;
      text-align: center;
    }

    .survey-header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .survey-header p {
      font-size: 0.95rem;
      color: var(--text-sub);
    }

    .question-group {
      margin-bottom: 32px;
    }

    .question-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 14px;
      display: block;
    }

    .chip-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .chip-label {
      cursor: pointer;
    }

    .chip-label input {
      display: none;
    }

    .chip-box {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 48px; /* 터치하기 편한 높이 */
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      font-size: 0.95rem;
      color: var(--text-main);
      background-color: #fff;
      transition: all 0.15s ease;
      text-align: center;
    }

    .chip-label input:checked + .chip-box {
      border-color: var(--selected-border);
      background-color: var(--selected-bg);
      color: var(--primary);
      font-weight: 700;
    }

    .intensity-scale {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 6px;
    }

    .intensity-box {
      height: 50px;
      border-radius: 10px;
      font-size: 1rem;
    }

    .intensity-legend {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      color: var(--text-sub);
      margin-top: 10px;
      padding: 0 4px;
    }

    .submit-btn {
      width: 100%;
      height: 54px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease, opacity 0.15s ease;
      margin-top: 10px;
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* 완료 화면 */
    .complete-screen {
      display: none;
      text-align: center;
      padding: 50px 20px 40px;
    }

    .complete-icon {
      width: 56px;
      height: 56px;
      background-color: #dcfce7;
      color: #16a34a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin: 0 auto 20px;
    }

    .complete-screen h2 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 10px;
      color: var(--text-main);
    }

    .complete-screen p {
      font-size: 0.95rem;
      color: var(--text-sub);
      line-height: 1.5;
    }

    /* 하단 자동 복귀 프로그레스 바 */
    .reset-progress-track {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background: #f1f5f9;
      display: none;
    }

    .reset-progress-bar {
      height: 100%;
      width: 0%;
      background: var(--primary);
      transition: width 2.5s linear;
    }
  </style>
</head>
<body>

  <div class="kiosk-container">
    <!-- 설문 폼 -->
    <form id="happinessForm">
      <div class="survey-header">
        <h1>순간의 행복 기록</h1>
        <p>익명으로 집계되는 10초 설문입니다.</p>
      </div>

      <!-- 항목 1: 행복 유지 시간 -->
      <div class="question-group">
        <label class="question-title">1. 행복 유지 시간</label>
        <div class="chip-grid">
          <label class="chip-label"><input type="radio" name="duration" value="1분" required><div class="chip-box">1분</div></label>
          <label class="chip-label"><input type="radio" name="duration" value="2분"><div class="chip-box">2분</div></label>
          <label class="chip-label"><input type="radio" name="duration" value="3분"><div class="chip-box">3분</div></label>
          <label class="chip-label"><input type="radio" name="duration" value="5분"><div class="chip-box">5분</div></label>
          <label class="chip-label"><input type="radio" name="duration" value="10분"><div class="chip-box">10분</div></label>
          <label class="chip-label"><input type="radio" name="duration" value="30분"><div class="chip-box">30분</div></label>
          <label class="chip-label"><input type="radio" name="duration" value="1시간"><div class="chip-box">1시간</div></label>
          <label class="chip-label"><input type="radio" name="duration" value="1시간 이상"><div class="chip-box">1시간+</div></label>
        </div>
      </div>

      <!-- 항목 2: 행복 강도 -->
      <div class="question-group">
        <label class="question-title">2. 행복 강도 (1 - 10)</label>
        <div class="intensity-scale">
          <label class="chip-label"><input type="radio" name="intensity" value="1" required><div class="chip-box intensity-box">1</div></label>
          <label class="chip-label"><input type="radio" name="intensity" value="2"><div class="chip-box intensity-box">2</div></label>
          <label class="chip-label"><input type="radio" name="intensity" value="3"><div class="chip-box intensity-box">3</div></label>
          <label class="chip-label"><input type="radio" name="intensity" value="4"><div class="chip-box intensity-box">4</div></label>
          <label class="chip-label"><input type="radio" name="intensity" value="5"><div class="chip-box intensity-box">5</div></label>
          <label class="chip-label"><input type="radio" name="intensity" value="6"><div class="chip-box intensity-box">6</div></label>
          <label class="chip-label"><input type="radio" name="intensity" value="7"><div class="chip-box intensity-box">7</div></label>
          <label class="chip-label"><input type="radio" name="intensity" value="8"><div class="chip-box intensity-box">8</div></label>
          <label class="chip-label"><input type="radio" name="intensity" value="9"><div class="chip-box intensity-box">9</div></label>
          <label class="chip-label"><input type="radio" name="intensity" value="10"><div class="chip-box intensity-box">10</div></label>
        </div>
        <div class="intensity-legend">
          <span>은은한 기쁨</span>
          <span>강렬한 환희</span>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">기록 남기기</button>
    </form>

    <!-- 완료 안내 화면 -->
    <div class="complete-screen" id="completeScreen">
      <div class="complete-icon">✓</div>
      <h2>기록이 완료되었습니다!</h2>
      <p>소중한 순간을 공유해 주셔서 감사합니다.<br><small style="color:#94a3b8;">잠시 후 다음 참여 화면으로 이동합니다...</small></p>
    </div>

    <!-- 게이지 바 -->
    <div class="reset-progress-track" id="progressTrack">
      <div class="reset-progress-bar" id="progressBar"></div>
    </div>
  </div>

  <script>
    // 본인의 Google Apps Script 웹 앱 URL 입력
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyMvzC5bT1HtTJ6rCc_Ic_jjM3YePapL2arBYOaANKc5nIUALIJiP126sXRZ59eJmseRA/exec';

    const form = document.getElementById('happinessForm');
    const submitBtn = document.getElementById('submitBtn');
    const completeScreen = document.getElementById('completeScreen');
    const progressTrack = document.getElementById('progressTrack');
    const progressBar = document.getElementById('progressBar');

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      // 중복 제출 차단
      submitBtn.disabled = true;
      submitBtn.innerText = '저장 중...';

      const formData = new FormData(form);

      // 구글 시트로 백그라운드 전송
      fetch(SCRIPT_URL, {
        method: 'POST',
        body: formData,
        mode: 'no-cors'
      })
      .then(() => {
        showCompleteAndReset();
      })
      .catch(error => {
        console.error('Error:', error);
        alert('네트워크 연결을 확인해 주세요.');
        submitBtn.disabled = false;
        submitBtn.innerText = '기록 남기기';
      });
    });

    function showCompleteAndReset() {
      // 1. 폼 숨기고 완료 화면 및 게이지 표시
      form.style.display = 'none';
      completeScreen.style.display = 'block';
      progressTrack.style.display = 'block';

      // 2. 게이지 애니메이션 시작 (2.5초 동안 차오름)
      setTimeout(() => {
        progressBar.style.width = '100%';
      }, 50);

      // 3. 2.5초 후 초기화하여 다음 사람 맞이
      setTimeout(() => {
        form.reset(); // 라디오 버튼 선택값 초기화
        submitBtn.disabled = false;
        submitBtn.innerText = '기록 남기기';

        progressBar.style.transition = 'none';
        progressBar.style.width = '0%';
        progressTrack.style.display = 'none';

        completeScreen.style.display = 'none';
        form.style.display = 'block';

        // 게이지 애니메이션 복원
        setTimeout(() => {
          progressBar.style.transition = 'width 2.5s linear';
        }, 50);
      }, 2500);
    }
  </script>
</body>
</html>
