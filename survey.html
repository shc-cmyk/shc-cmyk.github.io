<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>현장 설문조사</title>
  <style>
  :root {
  --bg-color: #f4f6f3;          /* 은은하고 편안한 미색 세이지 베이스 배경 */
  --card-bg: #ffffff;
  --primary: #7d967e;          /* 차분하고 포근한 세이지 그린 메인 버튼 */
  --primary-hover: #6a826b;    /* 탭/호버 시 살짝 짙어지는 딥 포레스트 그린 */
  --text-main: #2b332c;        /* 눈이 편안한 딥 올리브 차콜 텍스트 */
  --text-sub: #788579;         /* 부드러운 뮤트 세이지 서브 텍스트 */
  --border-color: #e3ebe3;     /* 연하고 자연스러운 그리너리 테두리 */
  --selected-bg: #f0f5f0;      /* 선택 시 은은하게 맴도는 세이지 틴트 */
  --selected-border: #9cb59d;  /* 선택 시 테두리 강조선 */
}

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  body {
    background-color: var(--bg-color);
    color: var(--text-main);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 32px 24px;
  }

  /* 아이패드 화면에 맞춰 폭(max-width)과 내부 패딩 확장 */
  .kiosk-container {
    background: var(--card-bg);
    border-radius: 36px;
    box-shadow: 0 16px 48px rgba(189, 168, 153, 0.16);
    width: 100%;
    max-width: 720px;            /* 기존 520px -> 720px로 확장 */
    padding: 56px 48px;          /* 내부 패딩 넉넉하게 확장 */
    border: 1px solid var(--border-color);
    position: relative;
    overflow: hidden;
  }

  .survey-header {
    margin-bottom: 42px;
    text-align: center;
  }

  .survey-header h1 {
    font-size: 2.1rem;           /* 메인 타이틀 크기 확대 */
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 12px;
    color: var(--text-main);
  }

  .survey-header p {
    font-size: 1.15rem;          /* 부제 설명문 확대 */
    color: var(--text-sub);
  }

  .question-group {
    margin-bottom: 40px;
  }

  .question-title {
    font-size: 1.3rem;           /* 질문 라벨 확대 */
    font-weight: 600;
    margin-bottom: 18px;
    display: block;
    color: var(--text-main);
  }

  /* 행복 유지 시간 그리드 (간격 및 터치 영역 확대) */
  .chip-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }

  .chip-label {
    cursor: pointer;
  }

  .chip-label input {
    display: none;
  }

  .chip-box {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 64px;                /* 기존 48px -> 64px로 시원하게 터치 가능 */
    border: 1.8px solid var(--border-color);
    border-radius: 18px;
    font-size: 1.15rem;          /* 글자 크기 확대 */
    color: var(--text-main);
    background-color: #fff;
    transition: all 0.18s ease;
    text-align: center;
  }

  .chip-label input:checked + .chip-box {
    border-color: var(--selected-border);
    background-color: var(--selected-bg);
    color: var(--primary);
    font-weight: 700;
    box-shadow: 0 4px 12px rgba(201, 138, 117, 0.16);
  }

  /* 1-10 행복 강도 (간격 및 버튼 크기 확대) */
  .intensity-scale {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 8px;
  }

  .intensity-box {
    height: 66px;                /* 세로 길이 시원하게 확대 */
    border-radius: 14px;
    font-size: 1.25rem;          /* 숫자 크기 확대 */
  }

  .intensity-legend {
    display: flex;
    justify-content: space-between;
    font-size: 0.95rem;          /* 안내 문구 확대 */
    color: var(--text-sub);
    margin-top: 14px;
    padding: 0 6px;
  }

  /* 하단 제출 버튼 */
  .submit-btn {
    width: 100%;
    height: 68px;                /* 터치하기 편한 묵직한 높이 */
    background-color: var(--primary);
    color: #ffffff;
    border: none;
    border-radius: 20px;
    font-size: 1.25rem;          /* 버튼 글자 확대 */
    font-weight: 700;
    cursor: pointer;
    transition: background-color 0.18s ease, transform 0.1s ease, opacity 0.15s ease;
    margin-top: 14px;
    box-shadow: 0 6px 18px rgba(125, 150, 126, 0.28);
  }

  .submit-btn:hover:not(:disabled) {
    background-color: var(--primary-hover);
  }

  .submit-btn:active:not(:disabled) {
    transform: scale(0.99);
  }

  .submit-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    box-shadow: none;
  }

  /* 완료 화면 */
  .complete-screen {
    display: none;
    text-align: center;
    padding: 70px 20px 50px;
  }

  .complete-icon {
    width: 72px;                 /* 체크 아이콘 확대 */
    height: 72px;
    background-color: #fbede6;
    color: var(--primary);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    margin: 0 auto 24px;
  }

  .complete-screen h2 {
    font-size: 1.9rem;
    font-weight: 700;
    margin-bottom: 14px;
    color: var(--text-main);
  }

  .complete-screen p {
    font-size: 1.15rem;
    color: var(--text-sub);
    line-height: 1.6;
  }

  /* 하단 복귀 게이지 바 */
  .reset-progress-track {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 6px;
    background: #f5efe8;
    display: none;
  }

  .reset-progress-bar {
    height: 100%;
    width: 0%;
    background: var(--primary);
    transition: width 2.5s linear;
  }
</style>
</head>
<body>

  <div class="kiosk-container">
    <!-- 설문 폼 -->
    <form id="happinessForm">
      <div class="survey-header">
        <h1>꽝 없는 뽑기 🍀</h1>
        <p>활동을 진행한 후 느낀 행복을 기록해 주세요.</p>
      </div>

      <!-- 항목 1: 행복 유지 시간 -->
      <div class="question-group">
        <label class="question-title">1. 행복 유지 시간</label>
        <div class="chip-grid">
          <label class="chip-label"><input type="radio" name="duration" value="10초" required><div class="chip-box">10초</div></label>
          <label class="chip-label"><input type="radio" name="duration" value="20초"><div class="chip-box">20초</div></label>
          <label class="chip-label"><input type="radio" name="duration" value="30초"><div class="chip-box">30초</div></label>
          <label class="chip-label"><input type="radio" name="duration" value="1분"><div class="chip-box">1분</div></label>
          <label class="chip-label"><input type="radio" name="duration" value="3분"><div class="chip-box">3분</div></label>
          <label class="chip-label"><input type="radio" name="duration" value="5분"><div class="chip-box">5분</div></label>
          <label class="chip-label"><input type="radio" name="duration" value="10분"><div class="chip-box">10분</div></label>
          <label class="chip-label"><input type="radio" name="duration" value="30분 이상"><div class="chip-box">30분+</div></label>
        </div>
      </div>

      <!-- 항목 2: 행복 강도 -->
      <div class="question-group">
        <label class="question-title">2. 행복 강도</label>
        <div class="intensity-scale">
          <label class="chip-label"><input type="radio" name="intensity" value="1" required><div class="chip-box intensity-box">1</div></label>
          <label class="chip-label"><input type="radio" name="intensity" value="2"><div class="chip-box intensity-box">2</div></label>
          <label class="chip-label"><input type="radio" name="intensity" value="3"><div class="chip-box intensity-box">3</div></label>
          <label class="chip-label"><input type="radio" name="intensity" value="4"><div class="chip-box intensity-box">4</div></label>
          <label class="chip-label"><input type="radio" name="intensity" value="5"><div class="chip-box intensity-box">5</div></label>
          <label class="chip-label"><input type="radio" name="intensity" value="6"><div class="chip-box intensity-box">6</div></label>
          <label class="chip-label"><input type="radio" name="intensity" value="7"><div class="chip-box intensity-box">7</div></label>
          <label class="chip-label"><input type="radio" name="intensity" value="8"><div class="chip-box intensity-box">8</div></label>
          <label class="chip-label"><input type="radio" name="intensity" value="9"><div class="chip-box intensity-box">9</div></label>
          <label class="chip-label"><input type="radio" name="intensity" value="10"><div class="chip-box intensity-box">10</div></label>
        </div>
        <div class="intensity-legend">
          <span>약간 행복함</span>
          <span>매우 행복함</span>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">설문 제출 ✔️</button>
    </form>

    <!-- 완료 안내 화면 -->
    <div class="complete-screen" id="completeScreen">
      <div class="complete-icon">✓</div>
      <h2>기록이 완료되었습니다!</h2>
      <p>소중한 순간을 공유해 주셔서 감사합니다.<br><small style="color:#94a3b8;">잠시 후 다음 참여 화면으로 이동합니다...</small></p>
    </div>

    <!-- 게이지 바 -->
    <div class="reset-progress-track" id="progressTrack">
      <div class="reset-progress-bar" id="progressBar"></div>
    </div>
  </div>

  <script>
    // 본인의 Google Apps Script 웹 앱 URL 입력
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzmQf58_ffcBFygGJWxc-tt5DNlGIj2wgL_B-qYrkC27A9lPkRcE2yjNYfDaeVOZlP4IA/exec';

    const form = document.getElementById('happinessForm');
    const submitBtn = document.getElementById('submitBtn');
    const completeScreen = document.getElementById('completeScreen');
    const progressTrack = document.getElementById('progressTrack');
    const progressBar = document.getElementById('progressBar');

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      // 중복 제출 차단
      submitBtn.disabled = true;
      submitBtn.innerText = '저장 중...';

      const formData = new FormData(form);

      // 구글 시트로 백그라운드 전송
      fetch(SCRIPT_URL, {
        method: 'POST',
        body: formData,
        mode: 'no-cors'
      })
      .then(() => {
        showCompleteAndReset();
      })
      .catch(error => {
        console.error('Error:', error);
        alert('네트워크 연결을 확인해 주세요.');
        submitBtn.disabled = false;
        submitBtn.innerText = '기록 남기기';
      });
    });

    function showCompleteAndReset() {
      // 1. 폼 숨기고 완료 화면 및 게이지 표시
      form.style.display = 'none';
      completeScreen.style.display = 'block';
      progressTrack.style.display = 'block';

      // 2. 게이지 애니메이션 시작 (2.5초 동안 차오름)
      setTimeout(() => {
        progressBar.style.width = '100%';
      }, 50);

      // 3. 2.5초 후 초기화하여 다음 사람 맞이
      setTimeout(() => {
        form.reset(); // 라디오 버튼 선택값 초기화
        submitBtn.disabled = false;
        submitBtn.innerText = '기록 남기기';

        progressBar.style.transition = 'none';
        progressBar.style.width = '0%';
        progressTrack.style.display = 'none';

        completeScreen.style.display = 'none';
        form.style.display = 'block';

        // 게이지 애니메이션 복원
        setTimeout(() => {
          progressBar.style.transition = 'width 2.5s linear';
        }, 50);
      }, 2500);
    }
  </script>
</body>
</html>
