<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>현장 설문조사</title>
  <style>
  :root {
    --bg-color: #f4f6f3;          /* 은은하고 편안한 미색 세이지 베이스 배경 */
    --card-bg: #ffffff;
    --primary: #7d967e;          /* 차분하고 포근한 세이지 그린 메인 버튼 */
    --primary-hover: #6a826b;    /* 탭/호버 시 살짝 짙어지는 딥 포레스트 그린 */
    --text-main: #2b332c;        /* 눈이 편안한 딥 올리브 차콜 텍스트 */
    --text-sub: #788579;         /* 부드러운 뮤트 세이지 서브 텍스트 */
    --border-color: #e3ebe3;     /* 연하고 자연스러운 그리너리 테두리 */
    --selected-bg: #f0f5f0;      /* 선택 시 은은하게 맴도는 세이지 틴트 */
    --selected-border: #9cb59d;  /* 선택 시 테두리 강조선 */
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  body {
    background-color: var(--bg-color);
    color: var(--text-main);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 32px 24px;
  }

  /* 아이패드 화면에 맞춰 폭(max-width)과 내부 패딩 확장 */
  .kiosk-container {
    background: var(--card-bg);
    border-radius: 36px;
    box-shadow: 0 16px 48px rgba(189, 168, 153, 0.16);
    width: 100%;
    max-width: 720px;
    padding: 56px 48px;
    border: 1px solid var(--border-color);
    position: relative;
    overflow: hidden;
  }

  .survey-header {
    margin-bottom: 42px;
    text-align: center;
  }

  .survey-header h1 {
    font-size: 2.1rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 12px;
    color: var(--text-main);
  }

  .survey-header p {
    font-size: 1.15rem;
    color: var(--text-sub);
  }

  .question-group {
    margin-bottom: 40px;
  }

  .question-title {
    font-size: 1.3rem;
    font-weight: 600;
    margin-bottom: 18px;
    display: block;
    color: var(--text-main);
  }

  /* 행복 유지 시간 그리드 */
  .chip-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }

  .chip-label {
    cursor: pointer;
  }

  .chip-label input {
    display: none;
  }

  .chip-box {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 64px;
    border: 1.8px solid var(--border-color);
    border-radius: 18px;
    font-size: 1.15rem;
    color: var(--text-main);
    background-color: #fff;
    transition: all 0.18s ease;
    text-align: center;
  }

  .chip-label input:checked + .chip-box {
    border-color: var(--selected-border);
    background-color: var(--selected-bg);
    color: var(--primary);
    font-weight: 700;
    box-shadow: 0 4px 12px rgba(125, 150, 126, 0.2);
  }

  /* 8개 기본 버튼과 직접 입력 사이의 옅은 구분선 */
  .custom-divider {
    height: 1px;
    background-color: var(--border-color);
    margin: 20px 0 16px 0;
    opacity: 0.8;
  }

  /* 직접 입력 전용 컨테이너 */
  .custom-duration-container {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .custom-chip-label {
    flex: 1.1;
    cursor: pointer;
  }

  .custom-inputs-wrapper {
    flex: 2;
    display: flex;
    gap: 10px;
    align-items: center;
  }

  /* 숫자 입력창 (상시 활성화 & 스피너 제거) */
  .custom-num-input {
    flex: 1.1;
    height: 64px;
    border: 1.8px solid var(--border-color);
    border-radius: 18px;
    padding: 0 16px;
    font-size: 1.25rem;
    font-weight: 600;
    color: var(--text-main);
    background-color: #ffffff;
    outline: none;
    text-align: center;
    user-select: auto;
    -webkit-user-select: auto;
    appearance: textfield;        /* 표준 속성: 에디터 노란 경고 방지 */
    -moz-appearance: textfield;   /* 파이어폭스 호환 */
  }

  .custom-num-input::-webkit-outer-spin-button,
  .custom-num-input::-webkit-inner-spin-button {
    -webkit-appearance: none;     /* 사파리/크롬 화살표 제거 */
    margin: 0;
  }

  .custom-num-input::placeholder {
    color: #b5c2b6;               /* 옅은 세이지 톤 플레이스홀더 */
    font-weight: 500;
  }

  .custom-num-input:focus {
    border-color: var(--selected-border);
    background-color: var(--selected-bg);
  }

  /* 좌우 분/시간 선택 세그먼트 컨트롤 */
  .unit-toggle-group {
    flex: 1.2;
    display: flex;
    height: 64px;
    background-color: #ffffff;
    border: 1.8px solid var(--border-color);
    border-radius: 18px;
    padding: 4px;
    gap: 4px;
  }

  .unit-btn {
    flex: 1;
    border: none;
    background: transparent;
    border-radius: 14px;
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .unit-btn.active {
    background-color: var(--selected-bg);
    color: var(--primary);
    font-weight: 700;
    border: 1.5px solid var(--selected-border);
    box-shadow: 0 2px 6px rgba(125, 150, 126, 0.15);
  }

  /* 1-10 행복 강도 */
  .intensity-scale {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 8px;
  }

  .intensity-box {
    height: 66px;
    border-radius: 14px;
    font-size: 1.25rem;
  }

  .intensity-legend {
    display: flex;
    justify-content: space-between;
    font-size: 0.95rem;
    color: var(--text-sub);
    margin-top: 14px;
    padding: 0 6px;
  }

  /* 하단 제출 버튼 */
  .submit-btn {
    width: 100%;
    height: 68px;
    background-color: var(--primary);
    color: #ffffff;
    border: none;
    border-radius: 20px;
    font-size: 1.25rem;
    font-weight: 700;
    cursor: pointer;
    transition: background-color 0.18s ease, transform 0.1s ease, opacity 0.15s ease;
    margin-top: 14px;
    box-shadow: 0 6px 18px rgba(125, 150, 126, 0.28);
  }

  .submit-btn:hover:not(:disabled) {
    background-color: var(--primary-hover);
  }

  .submit-btn:active:not(:disabled) {
    transform: scale(0.99);
  }

  .submit-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    box-shadow: none;
  }

  /* 완료 화면 */
  .complete-screen {
    display: none;
    text-align: center;
    padding: 70px 20px 50px;
  }

  .complete-icon {
    width: 72px;
    height: 72px;
    background-color: #f0f5f0;
    color: var(--primary);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    margin: 0 auto 24px;
  }

  .complete-screen h2 {
    font-size: 1.9rem;
    font-weight: 700;
    margin-bottom: 14px;
    color: var(--text-main);
  }

  .complete-screen p {
    font-size: 1.15rem;
    color: var(--text-sub);
    line-height: 1.6;
  }

  /* 하단 복귀 게이지 바 */
  .reset-progress-track {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 6px;
    background: #f5efe8;
    display: none;
  }

  .reset-progress-bar {
    height: 100%;
    width: 0%;
    background: var(--primary);
    transition: width 2.5s linear;
  }
</style>
</head>
<body>

  <div class="kiosk-container">
    <!-- 설문 폼 -->
    <form id="happinessForm">
      <div class="survey-header">
        <h1>꽝 없는 뽑기 🍀</h1>
        <p>활동을 진행한 후 느낀 행복을 기록해 주세요.</p>
      </div>

      <!-- 항목 1: 행복 유지 시간 -->
      <div class="question-group">
        <label class="question-title">1. 행복 유지 시간</label>
        
        <!-- 기본 8개 프리셋 칩 -->
        <div class="chip-grid">
          <label class="chip-label"><input type="radio" name="duration" value="10초" required><div class="chip-box">10초</div></label>
          <label class="chip-label"><input type="radio" name="duration" value="20초"><div class="chip-box">20초</div></label>
          <label class="chip-label"><input type="radio" name="duration" value="30초"><div class="chip-box">30초</div></label>
          <label class="chip-label"><input type="radio" name="duration" value="1분"><div class="chip-box">1분</div></label>
          <label class="chip-label"><input type="radio" name="duration" value="3분"><div class="chip-box">3분</div></label>
          <label class="chip-label"><input type="radio" name="duration" value="5분"><div class="chip-box">5분</div></label>
          <label class="chip-label"><input type="radio" name="duration" value="10분"><div class="chip-box">10분</div></label>
          <label class="chip-label"><input type="radio" name="duration" value="30분"><div class="chip-box">30분</div></label>
        </div>

        <!-- 옅은 구분선 -->
        <div class="custom-divider"></div>

        <!-- 직접 입력 라인 -->
        <div class="custom-duration-container">
          <label class="custom-chip-label chip-label">
            <input type="radio" name="duration" id="customDurationRadio" value="__CUSTOM__">
            <div class="chip-box">직접 입력</div>
          </label>
          
          <div class="custom-inputs-wrapper" id="customInputsWrapper">
            <!-- inputmode="numeric" 추가: 태블릿 가상 키보드에서 숫자 패드가 바로 노출 -->
            <input type="number" id="customNumber" class="custom-num-input" placeholder="숫자" min="1" max="999" inputmode="numeric">
            
            <!-- 좌우 분/시간 선택 세그먼트 버튼 -->
            <div class="unit-toggle-group">
              <button type="button" class="unit-btn active" data-unit="분" id="unitMinBtn">분</button>
              <button type="button" class="unit-btn" data-unit="시간" id="unitHourBtn">시간</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 항목 2: 행복 강도 -->
      <div class="question-group">
        <label class="question-title">2. 행복 강도</label>
        <div class="intensity-scale">
          <label class="chip-label"><input type="radio" name="intensity" value="1" required><div class="chip-box intensity-box">1</div></label>
          <label class="chip-label"><input type="radio" name="intensity" value="2"><div class="chip-box intensity-box">2</div></label>
          <label class="chip-label"><input type="radio" name="intensity" value="3"><div class="chip-box intensity-box">3</div></label>
          <label class="chip-label"><input type="radio" name="intensity" value="4"><div class="chip-box intensity-box">4</div></label>
          <label class="chip-label"><input type="radio" name="intensity" value="5"><div class="chip-box intensity-box">5</div></label>
          <label class="chip-label"><input type="radio" name="intensity" value="6"><div class="chip-box intensity-box">6</div></label>
          <label class="chip-label"><input type="radio" name="intensity" value="7"><div class="chip-box intensity-box">7</div></label>
          <label class="chip-label"><input type="radio" name="intensity" value="8"><div class="chip-box intensity-box">8</div></label>
          <label class="chip-label"><input type="radio" name="intensity" value="9"><div class="chip-box intensity-box">9</div></label>
          <label class="chip-label"><input type="radio" name="intensity" value="10"><div class="chip-box intensity-box">10</div></label>
        </div>
        <div class="intensity-legend">
          <span>약간 행복함</span>
          <span>매우 행복함</span>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">설문 제출 ✔️</button>
    </form>

    <!-- 완료 안내 화면 -->
    <div class="complete-screen" id="completeScreen">
      <div class="complete-icon">✓</div>
      <h2>기록이 완료되었습니다!</h2>
      <p>소중한 의견을 공유해 주셔서 감사합니다.<br><small style="color:#94a3b8;">잠시 후 다음 참여 화면으로 이동합니다...</small></p>
    </div>

    <!-- 게이지 바 -->
    <div class="reset-progress-track" id="progressTrack">
      <div class="reset-progress-bar" id="progressBar"></div>
    </div>
  </div>

  <script>
    // 본인의 Google Apps Script 웹 앱 URL 입력 (반드시 /exec 로 끝나는 주소)
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzmQf58_ffcBFygGJWxc-tt5DNlGIj2wgL_B-qYrkC27A9lPkRcE2yjNYfDaeVOZlP4IA/exec';

    const form = document.getElementById('happinessForm');
    const submitBtn = document.getElementById('submitBtn');
    const completeScreen = document.getElementById('completeScreen');
    const progressTrack = document.getElementById('progressTrack');
    const progressBar = document.getElementById('progressBar');

    // 직접 입력 관련 요소들
    const durationRadios = document.querySelectorAll('input[name="duration"]');
    const customRadio = document.getElementById('customDurationRadio');
    const customNumber = document.getElementById('customNumber');
    const unitButtons = document.querySelectorAll('.unit-btn');

    let selectedUnit = '분'; // 기본 단위

    // 1. 숫자 입력 칸을 터치하면 '직접 입력' 라디오가 자동으로 켜짐
    customNumber.addEventListener('focus', function() {
      customRadio.checked = true;
    });

    // 2. 분 / 시간 버튼을 누르면 해당 버튼이 켜지고, '직접 입력' 라디오도 자동으로 켜짐
    unitButtons.forEach(btn => {
      btn.addEventListener('click', function() {
        unitButtons.forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        selectedUnit = this.getAttribute('data-unit');
        customRadio.checked = true;
      });
    });

    // 3. 상단 8개 기본 버튼(10초~30분+)을 누르면 입력창에 적혀 있던 숫자 비우기
    durationRadios.forEach(radio => {
      radio.addEventListener('change', function() {
        if (!customRadio.checked) {
          customNumber.value = '';
        }
      });
    });

    // 4. 설문 제출 버튼 클릭 시 데이터 전송
    form.addEventListener('submit', function(e) {
      e.preventDefault();

      let finalDuration = '';

      // '직접 입력'이 선택된 상태라면 숫자와 단위를 합침 (예: 15분, 2시간)
      if (customRadio.checked) {
        const numVal = customNumber.value.trim();
        if (!numVal) {
          alert('유지 시간 숫자를 입력해 주세요.');
          customNumber.focus();
          return;
        }
        finalDuration = `${numVal}${selectedUnit}`;
      } else {
        const selectedRadio = document.querySelector('input[name="duration"]:checked');
        if (selectedRadio) {
          finalDuration = selectedRadio.value;
        }
      }

      const selectedIntensity = document.querySelector('input[name="intensity"]:checked')?.value || '';

      // 구글 시트로 보낼 데이터 포장
      const submitData = new FormData();
      submitData.append('duration', finalDuration);
      submitData.append('intensity', selectedIntensity);

      // 연타 방지
      submitBtn.disabled = true;
      submitBtn.innerText = '저장 중...';

      // 구글 스프레드시트로 전송
      fetch(SCRIPT_URL, {
        method: 'POST',
        body: submitData,
        mode: 'no-cors'
      })
      .then(() => {
        showCompleteAndReset();
      })
      .catch(error => {
        console.error('Error:', error);
        alert('네트워크 연결을 확인해 주세요.');
        submitBtn.disabled = false;
        submitBtn.innerText = '설문 제출 ✔️';
      });
    });

    // 5. 완료 화면 노출 후 다음 사람을 위한 자동 초기화 함수
    function showCompleteAndReset() {
      form.style.display = 'none';
      completeScreen.style.display = 'block';
      progressTrack.style.display = 'block';

      // 게이지 바 애니메이션 시작 (2.5초)
      setTimeout(() => {
        progressBar.style.width = '100%';
      }, 50);

      // 2.5초 후 폼을 깨끗이 비우고 첫 화면으로 복귀
      setTimeout(() => {
        form.reset(); // 모든 선택 초기화

        // 숫자 칸과 단위 버튼 기본값 복원
        customNumber.value = '';
        unitButtons.forEach(b => b.classList.remove('active'));
        document.getElementById('unitMinBtn').classList.add('active');
        selectedUnit = '분';

        submitBtn.disabled = false;
        submitBtn.innerText = '설문 제출 ✔️';

        progressBar.style.transition = 'none';
        progressBar.style.width = '0%';
        progressTrack.style.display = 'none';

        completeScreen.style.display = 'none';
        form.style.display = 'block';

        // 게이지 바 복원
        setTimeout(() => {
          progressBar.style.transition = 'width 2.5s linear';
        }, 50);
      }, 2500);
    }
  </script>
</body>
</html>
