<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FILM ARCHIVE</title>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel CDN (TSX 해석용) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    :root {
      --bg-color: #ffffff;             /* 바탕색 (순백색) */
      --card-bg: #f8fafc;             /* 카드 배경 (파스텔 연연한 블루) */
      --border-color: #e2e8f0;         /* 테두리 */
      --text-main: #334155;            /* 메인 텍스트 */
      --text-sub: #64748b;             /* 보조 텍스트 */
      --accent-pastel: #e0f2fe;        /* 검색/기본 버튼 */
      --accent-hover: #bae6fd;         
      --accent-text: #0369a1;          
      
      /* 연한 파란색 복사 버튼 색상 설정 */
      --accent-light-blue: #38bdf8;     
      --accent-light-blue-hover: #0284c7; 

      /* Format 태그 */
      --tag-format-bg: #bae6fd;
      --tag-format-text: #0284c7;
      --tag-format-border: #7dd3fc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      margin: 0;
      padding: 12px 10px;
      color: var(--text-main);
      display: flex;
      justify-content: center;
    }

    /* 첫 번째 작품 카드까지만 딱 보이도록 세로 높이 축소 (460px -> 335px) */
    .container {
      width: 620px;                   /* 검색 전후 모두 동일하게 고정 */
      height: 435px;                  /* 첫 번째 작품 카드 맞춤 높이 */
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 18px 20px;
      box-shadow: 0 4px 16px rgba(148, 163, 184, 0.12);
      overflow-y: auto;               /* 내부 스크롤 */
    }

    /* 커스텀 스크롤 바 */
    .container::-webkit-scrollbar {
      width: 6px;
    }
    .container::-webkit-scrollbar-track {
      background: transparent;
    }
    .container::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }
    .container::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    .header {
      text-align: center;
      margin-bottom: 16px;
    }

    .header h1 {
      font-size: 1.4rem;
      letter-spacing: -0.02em;
      margin: 0;
      font-weight: 700;
      color: var(--text-main);
    }

    .search-form {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }

    .input-field {
      flex: 1;
      padding: 9px 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      background-color: #f1f5f9;
      color: var(--text-main);
      transition: all 0.2s ease;
    }

    .input-field:focus {
      border-color: #93c5fd;
      background-color: #ffffff;
    }

    .btn {
      padding: 9px 16px;
      background-color: var(--accent-pastel);
      color: var(--accent-text);
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      min-width: 46px;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    .btn:disabled {
      background-color: #f1f5f9;
      border-color: #e2e8f0;
      color: #94a3b8;
      cursor: not-allowed;
    }

    .results-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px 18px;
      display: flex;
      gap: 18px;
      border: 1px solid var(--border-color);
      box-shadow: 0 2px 6px rgba(148, 163, 184, 0.06);
      transition: all 0.2s ease;
    }

    .card:hover {
      border-color: #cbd5e1;
      box-shadow: 0 4px 10px rgba(148, 163, 184, 0.12);
    }

    .poster-wrapper {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
      width: 110px;
    }

    .poster-img {
      width: 110px;
      height: 165px;
      object-fit: cover;
      border-radius: 8px;
      background-color: #e2e8f0;
      border: 1px solid var(--border-color);
    }

    .btn-download {
      padding: 5px 8px;
      background-color: #ffffff;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.2s ease;
    }

    .btn-download:hover {
      background-color: var(--accent-pastel);
      color: var(--accent-text);
      border-color: #93c5fd;
    }

    .btn-download.copied {
      background-color: var(--accent-pastel);
      color: var(--accent-text);
      border-color: #7dd3fc;
    }

    .info-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
    }

    .title-group {
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 6px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }

    .title-text-wrapper {
      display: flex;
      align-items: baseline;
      gap: 6px;
      flex-wrap: wrap;
    }

    .title-korean {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .title-original {
      font-size: 0.82rem;
      color: var(--text-sub);
    }

    .attr-table {
      display: grid;
      grid-template-columns: 80px 1fr;
      row-gap: 12px;
      font-size: 13px;
      align-items: center;
    }

    .attr-label {
      color: var(--text-sub);
      font-weight: 600;
    }

    .attr-value-wrapper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .attr-value {
      color: var(--text-main);
      line-height: 1.35;
      word-break: break-word;
    }

    .btn-copy-icon {
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 3px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .btn-copy-icon svg {
      width: 15px;
      height: 15px;
      fill: var(--accent-light-blue);
      transition: fill 0.2s ease, transform 0.15s ease;
    }

    .btn-copy-icon:hover {
      background-color: var(--accent-pastel);
    }

    .btn-copy-icon:hover svg {
      fill: var(--accent-light-blue-hover);
      transform: scale(1.08);
    }

    .btn-copy-icon.copied svg {
      fill: #0284c7;
      transform: scale(1.15);
    }

    .tag {
      display: inline-block;
      background: #e2e8f0;
      color: #334155;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 11px;
      margin-right: 4px;
      margin-bottom: 2px;
    }

    .tag-format {
      background: var(--tag-format-bg);
      color: var(--tag-format-text);
      font-weight: 700;
      border: 1px solid var(--tag-format-border);
    }

    .loading-text {
      text-align: center;
      color: var(--text-sub);
      padding: 20px;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel" data-presets="typescript,react">
    const { useState } = React;

    const TMDB_API_KEY = "2b41b01f33bead2c5ec02d391886ae25";
    const TMDB_READ_TOKEN = "eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiIyYjQxYjAxZjMzYmVhZDJjNWVjMDJkMzkxODg2YWUyNSIsIm5iZiI6MTc4NTY3MTU5My42MzEsInN1YiI6IjZhNmYyZmE5M2RiMGIzM2NlZjk1MDdmYiIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.bLxLfumrSA-GVX5Czby354InzGJHKNesSHAdBtK5iH8";
    const TMDB_BASE_URL = "https://api.themoviedb.org/3";
    const TMDB_IMAGE_BASE_URL = "https://image.tmdb.org/t/p/w500";

    const CopyIcon = ({ copied }) => (
      copied ? (
        <svg viewBox="0 0 24 24">
          <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" />
        </svg>
      ) : (
        <svg viewBox="0 0 24 24">
          <path d="M19 3H10C8.89543 3 8 3.89543 8 5V7H10V5H19V14H17V16H19C20.1046 16 21 15.1046 21 14V5C21 3.89543 20.1046 3 19 3Z" />
          <path fillRule="evenodd" clipRule="evenodd" d="M5 8H14C15.1046 8 16 8.89543 16 10V19C16 20.1046 15.1046 21 14 21H5C3.89543 21 3 20.1046 3 19V10C3 8.89543 3.89543 8 5 8ZM5 10H14V19H5V10Z" />
        </svg>
      )
    );

    const CopyButton = ({ text, title }) => {
      const [copied, setCopied] = useState(false);

      const handleCopy = async () => {
        if (!text || text === 'No information') return;
        try {
          await navigator.clipboard.writeText(text);
          setCopied(true);
          setTimeout(() => setCopied(false), 1200);
        } catch (err) {
          console.error("Failed to copy:", err);
        }
      };

      return (
        <button 
          className={`btn-copy-icon ${copied ? 'copied' : ''}`} 
          onClick={handleCopy} 
          title={title}
        >
          <CopyIcon copied={copied} />
        </button>
      );
    };

    const PosterCopyButton = ({ imageUrl }) => {
      const [copied, setCopied] = useState(false);

      const handleCopy = async () => {
        try {
          await navigator.clipboard.writeText(imageUrl);
          setCopied(true);
          setTimeout(() => setCopied(false), 1200);
        } catch (err) {
          console.error("Failed to copy image URL:", err);
        }
      };

      return (
        <button 
          className={`btn-download ${copied ? 'copied' : ''}`} 
          onClick={handleCopy}
        >
          {copied ? '✓ Copied' : '🔗 Copy'}
        </button>
      );
    };

    const App = () => {
      const [query, setQuery] = useState('');
      const [items, setItems] = useState([]);
      const [loading, setLoading] = useState(false);
      const [searched, setSearched] = useState(false);

      const handleSearch = async (e) => {
        e.preventDefault();
        if (!query.trim()) return;

        setLoading(true);
        setSearched(true);

        try {
          const searchRes = await fetch(
            `${TMDB_BASE_URL}/search/multi?api_key=${TMDB_API_KEY}&language=ko-KR&query=${encodeURIComponent(query)}&page=1`,
            { headers: { Authorization: `Bearer ${TMDB_READ_TOKEN}` } }
          );
          const searchData = await searchRes.json();
          const filtered = (searchData.results || []).filter(
            item => item.media_type === 'movie' || item.media_type === 'tv'
          );

          const detailedItems = await Promise.all(
            filtered.map(async (item) => {
              const isMovie = item.media_type === 'movie';
              const detailUrl = `${TMDB_BASE_URL}/${isMovie ? 'movie' : 'tv'}/${item.id}?language=ko-KR`;
              const creditUrl = `${TMDB_BASE_URL}/${isMovie ? 'movie' : 'tv'}/${item.id}/credits`;

              const [detailRes, creditRes] = await Promise.all([
                fetch(detailUrl, { headers: { Authorization: `Bearer ${TMDB_READ_TOKEN}` } }),
                fetch(creditUrl, { headers: { Authorization: `Bearer ${TMDB_READ_TOKEN}` } })
              ]);

              const detail = await detailRes.json();
              const credits = await creditRes.json();

              const title = isMovie ? detail.title : detail.name;
              const originalTitle = isMovie ? detail.original_title : detail.original_name;
              const format = isMovie ? 'Movie' : 'Series';
              
              const dateStr = isMovie ? detail.release_date : detail.first_air_date;
              const year = dateStr ? parseInt(dateStr.split('-')[0], 10) : 'No information';

              const nation = isMovie
                ? (detail.production_countries || []).map(c => c.name)
                : (detail.origin_country || []);

              const runningTime = isMovie
                ? (detail.runtime ? `${detail.runtime}분` : 'No information')
                : (detail.number_of_episodes ? `${detail.number_of_episodes}부작` : 'No information');

              const image = detail.poster_path ? `${TMDB_IMAGE_BASE_URL}${detail.poster_path}` : null;
              const genre = (detail.genres || []).map(g => g.name);

              const actors = (credits.cast || [])
                .slice(0, 5)
                .map(a => a.original_name || a.name);

              let director = '';
              if (isMovie) {
                const dirObj = (credits.crew || []).find(c => c.job === 'Director');
                director = dirObj ? (dirObj.original_name || dirObj.name) : 'No information';
              } else {
                const creators = (detail.created_by || []).map(c => c.original_name || c.name);
                director = creators.length > 0 ? creators.join(', ') : 'No information';
              }

              return {
                id: item.id,
                title,
                originalTitle,
                format,
                year: year !== 'No information' ? `${year}년` : year,
                nation,
                runningTime,
                image,
                actors,
                director,
                genre
              };
            })
          );

          setItems(detailedItems);
        } catch (err) {
          console.error("Data load failure:", err);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="container">
          <div className="header">
            <h1>FILM ARCHIVE</h1>
          </div>

          <form onSubmit={handleSearch} className="search-form">
            <input
              type="text"
              className="input-field"
              placeholder="Search..."
              value={query}
              onChange={(e) => setQuery(e.target.value)}
            />
            <button type="submit" className="btn" disabled={loading}>
              {loading ? '⏳' : '🔍'}
            </button>
          </form>

          {loading && <div className="loading-text">Loading details...</div>}

          {!loading && searched && items.length === 0 && (
            <div className="loading-text">No search results found.</div>
          )}

          <div className="results-grid">
            {items.map((item) => (
              <div key={item.id} className="card">
                <div className="poster-wrapper">
                  {item.image ? (
                    <>
                      <img src={item.image} alt={item.title} className="poster-img" />
                      <PosterCopyButton imageUrl={item.image} />
                    </>
                  ) : (
                    <div className="poster-img" style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--text-sub)', fontSize: '11px' }}>
                      🖼️ No image
                    </div>
                  )}
                </div>

                <div className="info-container">
                  <div className="title-group">
                    <div className="title-text-wrapper">
                      <span className="title-korean">{item.title}</span>
                      <span className="title-original">({item.originalTitle})</span>
                    </div>
                    <CopyButton text={item.originalTitle} title="Original Title 복사" />
                  </div>

                  <div className="attr-table">
                    {/* Format */}
                    <div className="attr-label">Format</div>
                    <div>
                      <span className="tag tag-format">{item.format}</span>
                    </div>

                    {/* Year */}
                    <div className="attr-label">Year</div>
                    <div className="attr-value-wrapper">
                      <span className="attr-value">{item.year}</span>
                      <CopyButton text={item.year} title="Year 복사" />
                    </div>

                    {/* Run Time */}
                    <div className="attr-label">Run Time</div>
                    <div className="attr-value-wrapper">
                      <span className="attr-value">{item.runningTime}</span>
                      <CopyButton text={item.runningTime} title="Run Time 복사" />
                    </div>

                    {/* Director */}
                    <div className="attr-label">Director</div>
                    <div className="attr-value-wrapper">
                      <span className="attr-value">{item.director}</span>
                      <CopyButton text={item.director} title="Director 복사" />
                    </div>

                    {/* Actors */}
                    <div className="attr-label">Actors</div>
                    <div className="attr-value-wrapper">
                      <span className="attr-value">
                        {item.actors.length > 0 ? item.actors.join(', ') : 'No information'}
                      </span>
                      {item.actors.length > 0 && (
                        <CopyButton text={item.actors.join(', ')} title="Actors 복사" />
                      )}
                    </div>

                    {/* Nation */}
                    <div className="attr-label">Nation</div>
                    <div className="attr-value">
                      {item.nation.length > 0 ? (
                        item.nation.map((n, idx) => <span key={idx} className="tag">{n}</span>)
                      ) : 'No information'}
                    </div>

                    {/* Genre */}
                    <div className="attr-label">Genre</div>
                    <div className="attr-value">
                      {item.genre.length > 0 ? (
                        item.genre.map((g, idx) => <span key={idx} className="tag">{g}</span>)
                      ) : 'No information'}
                    </div>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
